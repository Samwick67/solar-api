<!DOCTYPE html>
<html>
<head>
  <title>Solar Tracking ML System</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    input, select {
      padding: 10px;
      margin: 5px;
      width: 200px;
    }

    button {
      padding: 10px 20px;
      background: #22c55e;
      border: none;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
    }
  </style>
</head>

<body>

  <h1>Solar Tracking ML System</h1>
  <h3>SD Naidoo (22466714)</h3>

  <div class="box">

    <input id="hour" placeholder="Hour"><br>
    <input id="loadshedding" placeholder="Loadshedding"><br>
    <input id="light" placeholder="Light Intensity"><br>
    <input id="battery" placeholder="Battery Level"><br>

    <select id="weather">
      <option>Sunny</option>
      <option>Cloudy</option>
    </select><br>

    <button onclick="predict()">Predict Angle</button>

    <h2 id="result"></h2>

  </div>

<script>
async function predict() {

  const data = {
    hour: parseInt(document.getElementById("hour").value),
    loadshedding: parseInt(document.getElementById("loadshedding").value),
    light_intensity: parseInt(document.getElementById("light").value),
    battery_level: parseInt(document.getElementById("battery").value),
    weather: document.getElementById("weather").value
  };

  const response = await fetch("https://solar-api-hgqt.onrender.com//predict", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  const result = await response.json();

  document.getElementById("result").innerText =
    "Predicted Panel Angle: " + result.predicted_angle + "°";
}
</script>

</body>
</html>
