<!DOCTYPE html>
<html>
<head>
  <title>Solar Tracking ML System</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      display: inline-block;
      width: 380px;
    }

    select, input {
      padding: 10px;
      margin: 6px;
      width: 240px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 20px;
      background: #22c55e;
      border: none;
      color: white;
      cursor: pointer;
      margin-top: 10px;
      border-radius: 6px;
    }

    button:disabled {
      background: gray;
      cursor: not-allowed;
    }

    #panel {
      width: 120px;
      height: 120px;
      margin: 20px auto;
      background: linear-gradient(45deg, #facc15, #f59e0b);
      border-radius: 10px;
      transition: transform 1s ease;
    }

    canvas {
      margin-top: 20px;
      background: white;
      border-radius: 10px;
    }

    .slider {
      width: 240px;
    }

    #status {
      margin-top: 10px;
      color: #38bdf8;
    }
  </style>
</head>

<body>

<h1>Solar Tracking ML System</h1>
<h3>SD Naidoo (22466714)</h3>

<div class="box">

  <select id="loadshedding">
    <option value="1">Stage 1</option>
    <option value="2">Stage 2</option>
    <option value="3">Stage 3</option>
  </select><br>

  <input id="light" type="range" min="0" max="1000" value="500" class="slider">
  <label>Light: <span id="lightVal">500</span></label><br>

  <input id="battery" type="range" min="0" max="100" value="80" class="slider">
  <label>Battery: <span id="batteryVal">80</span>%</label><br>

  <input id="fixedVoltage" placeholder="Fixed Voltage"><br>
  <input id="trackingVoltage" placeholder="Tracking Voltage"><br>

  <input id="angle" type="range" min="0" max="180" value="90" class="slider">
  <label>Angle: <span id="angleVal">90</span>°</label><br>

  <button id="btn" onclick="predict()">Predict</button>

  <div id="status"></div>

  <h2 id="result"></h2>
  <h3 id="efficiency"></h3>

</div>

<div id="panel"></div>

<canvas id="chart" width="400" height="200"></canvas>

<script>

const API_URL = "https://solar-api-hgqt.onrender.com/predict";

// sliders
document.getElementById("light").oninput = e =>
  document.getElementById("lightVal").innerText = e.target.value;

document.getElementById("battery").oninput = e =>
  document.getElementById("batteryVal").innerText = e.target.value;

document.getElementById("angle").oninput = e =>
  document.getElementById("angleVal").innerText = e.target.value;

// chart
const ctx = document.getElementById("chart").getContext("2d");

const chart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [{
      label: "Predicted Solar Angle",
      data: [],
      borderColor: "green",
      fill: false
    }]
  }
});

// efficiency
function calcEfficiency(tracking, fixed) {
  if (!fixed || fixed == 0) return 0;
  return (((tracking - fixed) / fixed) * 100).toFixed(2);
}

// timeout fetch
function fetchWithTimeout(url, options, timeout = 15000) {
  return Promise.race([
    fetch(url, options),
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error("Request timeout")), timeout)
    )
  ]);
}

async function predict() {

  const btn = document.getElementById("btn");
  const status = document.getElementById("status");

  btn.disabled = true;
  status.innerText = "Processing... please wait";

  try {

    const data = {
      hour: 12,
      loadshedding: parseInt(document.getElementById("loadshedding").value),
      light_intensity: parseInt(document.getElementById("light").value),
      battery_level: parseInt(document.getElementById("battery").value),
      weather: "Sunny"
    };

    const res = await fetchWithTimeout(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    if (!res.ok) throw new Error("API error");

    const result = await res.json();

    const angle = result.predicted_angle;

    document.getElementById("result").innerText =
      "Predicted Panel Angle: " + angle + "°";

    const fixed = parseFloat(document.getElementById("fixedVoltage").value) || 0;
    const tracking = parseFloat(document.getElementById("trackingVoltage").value) || 0;

    const efficiency = calcEfficiency(tracking, fixed);

    document.getElementById("efficiency").innerText =
      "Efficiency Improvement: " + efficiency + "%";

    chart.data.labels.push("T" + chart.data.labels.length);
    chart.data.datasets[0].data.push(angle);
    chart.update();

    document.getElementById("panel").style.transform =
      `rotate(${angle}deg)`;

    status.innerText = "Done ✔";

  } catch (err) {
    console.error(err);
    status.innerText = "Error: " + err.message;
  }

  btn.disabled = false;
}

</script>

</body>
</html>
